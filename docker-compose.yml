version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - APP_ENV=production
    volumes:
      # Persist FF1 caches, scraped data, and AI stories
      - ./data:/app/data
      # Mount Firebase service account JSON (filename from .env FIREBASE_SERVICE_ACCOUNT_PATH)
      - ./apex-92c8d-firebase-adminsdk-fbsvc-e6f2448e04.json:/app/apex-92c8d-firebase-adminsdk-fbsvc-e6f2448e04.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
